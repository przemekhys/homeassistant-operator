            == self.spec.sourceWorkload.kind && has(self.spec.approvals) && self.spec.approvals.exists(a,
            a.id == ''source-stop'' && a.approved && has(a.sourceUID) && a.sourceUID
            == r.sourceWorkload.uid))))))'
        - message: resolutions must bind an accepted request
          rule: '!has(self.spec.executionProtocol) || self.spec.executionProtocol
            != ''v1'' || !has(self.spec.resolutions) || self.spec.resolutions.all(x,
            has(self.spec.executionRequests) && self.spec.executionRequests.exists(r,
            r.stage == x.stage && r.requestID == x.requestID))'
