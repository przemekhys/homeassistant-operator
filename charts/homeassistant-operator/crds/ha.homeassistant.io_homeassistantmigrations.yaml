            && r.sourceToken.key == self.spec.sourceTokenSecretRef.key && r.recoveryKey.name
            == self.spec.recoveryKeySecretRef.name && r.recoveryKey.key == self.spec.recoveryKeySecretRef.key)))'
        - message: restore credentials must bind current secret reference
          rule: '!has(self.spec.executionRequests) || self.spec.executionRequests.all(r,
            (has(oldSelf.spec.executionRequests) && oldSelf.spec.executionRequests.exists(o,
            o == r)) || (r.stage != ''restore'' || (has(self.spec.recoveryKeySecretRef)
            && r.recoveryKey.name == self.spec.recoveryKeySecretRef.name && r.recoveryKey.key
            == self.spec.recoveryKeySecretRef.key)))'
        - message: new restore stages must bind the source workload and stop approval
          rule: '!has(self.spec.executionRequests) || self.spec.executionRequests.all(r,
            (has(oldSelf.spec.executionRequests) && oldSelf.spec.executionRequests.exists(o,
