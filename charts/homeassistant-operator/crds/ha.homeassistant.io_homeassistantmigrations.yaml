            ''source-stop'' && a.approved && a.digest == r.reportID && has(a.targetUID)
            && a.targetUID == r.target.uid))))'
        - message: restore must bind accepted upload
          rule: '!has(self.spec.executionRequests) || self.spec.executionRequests.all(r,
            r.stage != ''restore'' || self.spec.executionRequests.exists(u, u.stage
            == ''upload'' && u.requestID == r.uploadRequestID && u.archiveRef == r.archiveRef
