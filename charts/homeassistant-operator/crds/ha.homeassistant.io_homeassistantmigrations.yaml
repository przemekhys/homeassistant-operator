          rule: '!has(self.spec.executionRequests) || self.spec.executionRequests.all(r,
            (has(oldSelf.spec.executionRequests) && oldSelf.spec.executionRequests.exists(o,
            o == r)) || (r.stage == ''backup'' ? (has(self.spec.sourceEndpoint) &&
            r.sourceEndpoint == self.spec.sourceEndpoint && has(self.spec.backupScopeDigest)
