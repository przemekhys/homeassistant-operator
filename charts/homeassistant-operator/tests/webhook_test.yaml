suite: validating webhook and its TLS wiring
templates:
  - webhook.yaml
tests:
  - it: is enabled by default (opt-out), self-managed cert, no cert-manager resources
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Service
        documentIndex: 0
      - isKind:
          of: ValidatingWebhookConfiguration
        documentIndex: 1

  - it: self-managed webhook config has no caBundle and no cert-manager annotation
    documentIndex: 1
    asserts:
      - isKind:
          of: ValidatingWebhookConfiguration
      - notExists:
          path: webhooks[0].clientConfig.caBundle
      - notExists:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]

  - it: renders nothing when disabled
    set:
      webhook.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: cert-manager override renders Service, Issuer, Certificate and webhook config
    set:
      webhook.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: Service
        documentIndex: 0
      - isKind:
          of: Issuer
        documentIndex: 1
      - isKind:
          of: Certificate
        documentIndex: 2
      - isKind:
          of: ValidatingWebhookConfiguration
        documentIndex: 3

  - it: cert-manager override injects the CA via annotation
    set:
      webhook.certManager.enabled: true
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/inject-ca-from"]
          value: NAMESPACE/RELEASE-NAME-homeassistant-operator-webhook-serving-cert

  - it: failurePolicy is configurable
    set:
      webhook.failurePolicy: Fail
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[0].failurePolicy
          value: Fail

  - it: routes migration creates and updates to the migration validator
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[3].name
          value: vhomeassistantmigration-v1alpha1.kb.io
      - equal:
          path: webhooks[3].failurePolicy
          value: Fail
      - equal:
          path: webhooks[3].clientConfig.service.path
          value: /validate-ha-homeassistant-io-v1alpha1-homeassistantmigration
      - equal:
          path: webhooks[3].rules[0]
          value:
            apiGroups: ["ha.homeassistant.io"]
            apiVersions: ["v1alpha1"]
            operations: ["CREATE", "UPDATE"]
            resources: ["homeassistantmigrations"]

  - it: filters migration isolation workloads to protected credential references
    documentIndex: 1
    asserts:
      - equal:
          path: webhooks[2].failurePolicy
          value: Fail
      - equal:
          path: webhooks[2].matchConditions[0].name
          value: references-migration-credentials
      - matchRegex:
          path: webhooks[2].matchConditions[0].expression
          pattern: "object\\.spec\\.template\\.spec\\.containers"

  - it: webhook Service name stays within the 63-char DNS-label limit for long release names
    release:
      name: a-very-long-release-name-for-testing-long-names
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - matchRegex:
          path: metadata.name
          pattern: "^.{1,63}$"

  - it: long release name still produces a Service name that Certificate and webhook config agree on (cert-manager mode)
    set:
      webhook.certManager.enabled: true
    release:
      name: a-very-long-release-name-for-testing-long-names
    asserts:
      - documentIndex: 0
        isKind:
            of: Service
      - documentIndex: 0
        equal:
            path: metadata.name
            value: a-very-long-release-name-for-testing-long-names-homeassistant-o
      - documentIndex: 2
        isKind:
            of: Certificate
      - documentIndex: 2
        equal:
            path: spec.dnsNames[0]
            value: a-very-long-release-name-for-testing-long-names-homeassistant-o.NAMESPACE.svc
      - documentIndex: 3
        isKind:
            of: ValidatingWebhookConfiguration
      - documentIndex: 3
        equal:
            path: webhooks[0].clientConfig.service.name
            value: a-very-long-release-name-for-testing-long-names-homeassistant-o
