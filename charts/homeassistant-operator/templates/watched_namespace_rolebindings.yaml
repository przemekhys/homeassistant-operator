{{- if not (empty .Values.watchNamespaces) }}
{{/* Dedicated operator token Secrets reuse this managed-namespace binding. */}}
{{- range .Values.watchNamespaces }}
{{- $ns := . | trim }}
{{- if not $ns }}
  {{- fail "watchNamespaces contains a blank entry — each item must be a non-empty namespace name" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "homeassistant-operator.fullname" $ }}-manager-rolebinding
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "homeassistant-operator.fullname" $ }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "homeassistant-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
