{{- if .Values.webhook.enabled }}
{{- $fullname := include "homeassistant-operator.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $svcName := include "homeassistant-operator.webhookServiceName" . }}
{{- $certSecret := include "homeassistant-operator.webhookCertSecretName" . }}
{{- $certName := include "homeassistant-operator.webhookCertificateName" . }}
{{- $vwcName := include "homeassistant-operator.validatingWebhookConfigurationName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "homeassistant-operator.selectorLabels" . | nindent 4 }}
    control-plane: controller-manager
  ports:
    - port: 443
      targetPort: webhook-server
      protocol: TCP
{{- if .Values.webhook.certManager.enabled }}
---
# cert-manager path (opt-in): cert-manager issues the serving certificate and
# injects the CA into the ValidatingWebhookConfiguration.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned-issuer
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ $ns }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
spec:
  secretName: {{ $certSecret }}
  dnsNames:
    - {{ printf "%s.%s.svc" $svcName $ns }}
    - {{ printf "%s.%s.svc.cluster.local" $svcName $ns }}
  issuerRef:
    name: {{ $fullname }}-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
{{- /* Self-managed serving-cert Secret is created by the operator itself
       (cert-controller updates but never creates it), so it is intentionally not
       rendered here — this avoids Helm ownership conflicts and cert-manager
       <-> self-managed switch issues. */}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $vwcName }}
  labels:
    {{- include "homeassistant-operator.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" $ns $certName }}
  {{- end }}
webhooks:
  # This boundary is deliberately independent of webhook.failurePolicy: a
  # skipped validation would let any Pod creator mount the worker key.
  - name: vmigrationisolationpods.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: references-migration-credentials
        expression: >-
          (has(object.spec.imagePullSecrets) && object.spec.imagePullSecrets.exists(s, s.name.startsWith('migration-proxy-'))) ||
          (has(object.spec.volumes) && object.spec.volumes.exists(v,
            (has(v.secret) && v.secret.secretName.startsWith('migration-proxy-')) ||
            (has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.secret) && s.secret.name.startsWith('migration-proxy-'))))) ||
          object.spec.containers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))) ||
          (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-'))))) ||
          (has(object.spec.ephemeralContainers) && object.spec.ephemeralContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))))
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-migration-isolation
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  - name: vmigrationisolationcredentials.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: reserved-credential-name
        expression: "(request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).startsWith('migration-proxy-')"
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-migration-isolation
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps"]
  - name: vmigrationisolationworkloads.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: references-migration-credentials
        expression: >-
          (has(object.spec.template.spec.imagePullSecrets) && object.spec.template.spec.imagePullSecrets.exists(s, s.name.startsWith('migration-proxy-'))) ||
          (has(object.spec.template.spec.volumes) && object.spec.template.spec.volumes.exists(v,
            (has(v.secret) && v.secret.secretName.startsWith('migration-proxy-')) ||
            (has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.secret) && s.secret.name.startsWith('migration-proxy-'))))) ||
          object.spec.template.spec.containers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))) ||
          (has(object.spec.template.spec.initContainers) && object.spec.template.spec.initContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-'))))) ||
          (has(object.spec.template.spec.ephemeralContainers) && object.spec.template.spec.ephemeralContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))))
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-migration-isolation
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
  - name: vhomeassistantmigration-v1alpha1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1alpha1-homeassistantmigration
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantmigrations"]
  - name: vhomeassistant-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      # In the default (self-managed) mode the operator injects caBundle at runtime
      # via cert-controller; with cert-manager it is injected via the annotation above.
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistant
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistants"]
  - name: vhomeassistantautomation-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantautomation
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantautomations"]
  - name: vhomeassistantscene-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantscene
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantscenes"]
  - name: vhomeassistantscript-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantscript
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantscripts"]
  - name: vhomeassistantconfiguration-v1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    clientConfig:
      service:
        name: {{ $svcName }}
        namespace: {{ $ns }}
        path: /validate-ha-homeassistant-io-v1-homeassistantconfiguration
    rules:
      - apiGroups: ["ha.homeassistant.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["homeassistantconfigurations"]
{{- end }}
