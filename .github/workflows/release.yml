name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abort a release mid-publish

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

      - name: Generate manifests
        run: make manifests generate

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (Sigstore/Fulcio via GitHub OIDC)

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless: cosign requests a short-lived Fulcio cert bound to this
      # workflow's own OIDC identity and records the signature in Rekor — no
      # key for the maintainer to store or rotate. Signs the manifest-list
      # digest (steps.build.outputs.digest), never a mutable tag, so
      # verification holds regardless of which architecture is pulled.
      - name: Sign container image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"

  helm-publish:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (Sigstore/Fulcio via GitHub OIDC)

    outputs:
      chart-digest: ${{ steps.chart.outputs.digest }}
      chart-ref: ${{ steps.chart.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update chart version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" charts/homeassistant-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/homeassistant-operator/Chart.yaml
          sed -i "s/^  tag:.*/  tag: \"${VERSION}\"/" charts/homeassistant-operator/values.yaml

      - name: Lint Helm chart
        run: helm lint charts/homeassistant-operator

      - name: Package and push Helm chart
        id: chart
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p dist
          helm package charts/homeassistant-operator --destination dist/
          CHART_REF="oci://${{ env.REGISTRY }}/${OWNER}/charts/homeassistant-operator"
          PUSH_OUTPUT=$(helm push dist/homeassistant-operator-${{ steps.version.outputs.VERSION }}.tgz "${CHART_REF%/*}" 2>&1 | tee /dev/stderr)
          CHART_DIGEST=$(echo "$PUSH_OUTPUT" | grep -oE '^Digest: sha256:[0-9a-f]{64}$' | awk '{print $2}')
          echo "digest=${CHART_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ref=${CHART_REF}" >> "$GITHUB_OUTPUT"

      # Keyless, same identity as the container image (see build-and-push). Signs
      # the pushed OCI artifact's own digest — cosign treats a Helm chart OCI
      # artifact the same as a container image for signing purposes. CHART_REF
      # carries the "oci://" scheme Helm needs; cosign's image reference parser
      # has no such scheme and misreads "oci" as a registry hostname, so it must
      # be stripped here.
      - name: Sign Helm chart
        env:
          CHART_REF: ${{ steps.chart.outputs.ref }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REF#oci://}@${CHART_DIGEST}"

  publish-release-assets:
    needs: [build-and-push, helm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # keyless cosign signing (Sigstore/Fulcio via GitHub OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Generate release installation manifest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE="$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          make build-installer IMG="${IMAGE}:${GITHUB_REF_NAME#v}"

      # One line per artifact: <sha256-digest>  <artifact-type>  <artifact-reference>.
      # Keep this format stable: docs and hack/verify-signatures.sh select entries
      # by their artifact type and reference.
      - name: Generate checksums manifest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          CHART_REF: ${{ needs.helm-publish.outputs.chart-ref }}
          CHART_DIGEST: ${{ needs.helm-publish.outputs.chart-digest }}
        run: |
          IMAGE="$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          MANIFEST_SHA256="$(sha256sum dist/install.yaml | awk '{print $1}')"
          cat > checksums.txt <<EOF
          ${IMAGE_DIGEST}  container-image  ${IMAGE}
          ${CHART_DIGEST}  helm-chart       ${CHART_REF}
          sha256:${MANIFEST_SHA256}  kustomize-manifest  install.yaml
          EOF

      # cosign >=3.0 dropped --output-signature/--output-certificate for
      # sign-blob in favor of a single --bundle file (signature + certificate +
      # Rekor entry together).
      - name: Sign checksums manifest
        run: |
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      # Expected flow: push the tag, then (while earlier jobs are still
      # running) draft a release for that tag in the GitHub UI — title,
      # notes, prerelease/latest, discussion — and save it as a DRAFT
      # (never publish it directly). A draft isn't subject to the
      # immutable-releases restriction, so this job just attaches the
      # checksums assets to it and publishes — everything set in the UI
      # survives untouched. This is a race against the earlier jobs; if the
      # draft isn't there yet, create fresh (see the final branch below). A
      # failure here fails the job the normal GitHub Actions way — no silent
      # unsigned/partial release.
      - name: Publish GitHub Release with signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft)"
            if [ "$IS_DRAFT" = "true" ]; then
              # Expected path: draft created via the UI, nothing else to do
              # but attach assets and publish.
              gh release upload "$TAG" dist/install.yaml checksums.txt checksums.txt.sigstore.json --repo "$REPO"
              gh release edit "$TAG" --repo "$REPO" --draft=false
            else
              # Published directly instead of left as a draft. Do NOT try to
              # delete-and-recreate: GitHub permanently refuses to reuse a
              # tag_name that was ever attached to an immutable release, even
              # after deletion ("tag_name was used by an immutable release"),
              # so a delete here only destroys a working release and leaves
              # an orphaned "untagged-..." release behind instead — strictly
              # worse than doing nothing. This needs a human: delete the tag
              # (and, if one exists, the orphaned untagged release) and push
              # a new one.
              echo "::error::Release ${TAG} is already published (not a draft)." \
                "Its assets are immutable and cannot be attached after the fact." \
                "Delete the tag and push a new one; next time, save the release" \
                "as a draft in the UI instead of publishing it directly." >&2
              exit 1
            fi
          else
            # No draft made yet (lost the race, or skipped it for a quick
            # release) — create fresh. Auto-detect prerelease from the tag's
            # semver prerelease identifier since there's no draft to read it
            # from, and it cannot be set after the fact.
            PRERELEASE_ARGS=()
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              PRERELEASE_ARGS=(--prerelease)
            fi
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}" \
              dist/install.yaml checksums.txt checksums.txt.sigstore.json
          fi

  smoke-oci:
    needs: [build-and-push, helm-publish, publish-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write # annotate the GitHub Release when the smoke test fails
      issues: write # raise a maintainer alert when the smoke test fails
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.3

      - name: Set up Helm and k3d
        uses: ./.github/actions/helm-setup
        with:
          install-k3d: "true"

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Dogfooding: run the exact commands the docs tell users to run, against
      # the artifacts this same run just published, so a broken signing setup
      # is caught here rather than only discovered by an external user.
      - name: Verify container image signature
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          IMAGE="$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${IMAGE_DIGEST}"

      # CHART_REF carries the "oci://" scheme (needed by Helm); cosign has no
      # such scheme and misreads "oci" as a hostname, so strip it here too.
      - name: Verify Helm chart signature
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*
          CHART_REF: ${{ needs.helm-publish.outputs.chart-ref }}
          CHART_DIGEST: ${{ needs.helm-publish.outputs.chart-digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${CHART_REF#oci://}@${CHART_DIGEST}"

      - name: Verify checksums manifest signature
        env:
          IDENTITY_REGEXP: https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/.*
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
            -p 'install.yaml' -p 'checksums.txt*' --clobber
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          awk '$2 == "kustomize-manifest" && $3 == "install.yaml" { print substr($1, 8) "  install.yaml"; found = 1 } END { exit !found }' checksums.txt | sha256sum -c -

      - name: Smoke test the published OCI chart
        id: smoke
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          HELM_REGISTRY="${{ env.REGISTRY }}/${OWNER}" ./hack/helm-smoke-oci.sh

      # On failure of any step above (signature verification or the install
      # smoke test): alert the maintainer and mark the release "needs
      # verification". Deliberately NO automatic yank/delete of the published
      # artifact — the decision to withdraw a release stays manual.
      - name: Alert on post-publish verification failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const version = process.env.GITHUB_REF_NAME;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Post-publish verification FAILED for ${version}`;
            const body = [
              `A post-publish check failed for **${version}** — either signature`,
              `verification (image/chart/checksums) or the OCI install smoke test.`,
              `See the failed run for which step failed.`,
              ``,
              `The artifacts were already published. This release is marked`,
              `**needs verification**. The artifact was intentionally NOT yanked —`,
              `decide manually whether to withdraw it.`,
              ``,
              `Failed run: ${runUrl}`,
            ].join('\n');
            // Create the alert issue defensively: if the labels do not exist the
            // API returns 422, so fall back to creating the issue without labels
            // rather than losing the maintainer notification entirely.
            let issueNumber = null;
            try {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['release', 'needs-verification'],
              });
              issueNumber = issue.data.number;
            } catch (e) {
              core.warning(`Issue creation with labels failed (${e.message}); retrying without labels.`);
              try {
                const issue = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
                issueNumber = issue.data.number;
              } catch (e2) {
                core.error(`Could not open alert issue for ${version}: ${e2.message}`);
              }
            }
            if (issueNumber) core.notice(`Opened alert issue #${issueNumber} for ${version}`);
            const ref = issueNumber ? ` (see #${issueNumber})` : '';
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag: version,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: rel.data.id,
                body: `> ⚠️ **Needs verification** — post-publish check failed${ref}.\n\n${rel.data.body || ''}`,
              });
            } catch (e) {
              core.warning(`Could not annotate release ${version}: ${e.message}`);
            }
