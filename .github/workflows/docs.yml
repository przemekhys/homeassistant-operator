name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
      - 'api/**'
      - 'charts/homeassistant-operator/values.yaml'
      - 'charts/homeassistant-operator/README.md'
      - 'Makefile'
      - 'hack/verify-docs-selfcontained.sh'
      - 'hack/verify-docs-shell.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
      - 'api/**'
      - 'charts/homeassistant-operator/values.yaml'
      - 'charts/homeassistant-operator/README.md'
      - 'Makefile'
      - 'hack/verify-docs-selfcontained.sh'
      - 'hack/verify-docs-shell.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: "deploy-pages-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate. Runs on pull requests too, so a broken link or a dead cross-repository
  # reference is caught before it can reach the published site.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/helm-setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.lock

      - name: Install Zensical dependencies
        run: pip install --require-hashes -r docs/requirements.lock

      - name: Generate CRD API reference
        run: make docs-api

      # The generated reference is committed, so a drift here means someone
      # changed the API types without regenerating it.
      - name: Fail if the committed API reference drifted from the Go types
        run: |
          if ! git diff --exit-code -- docs/reference/api.md; then
            echo "::error title=Generated API reference is stale::Run 'make docs-api' and commit docs/reference/api.md."
            echo "Generated API reference is out of date. Run 'make docs-api' and commit docs/reference/api.md." >&2
            exit 1
          fi

      - name: Fail if the committed Helm values reference drifted from chart defaults
        run: make helm-verify-docs HELM_DOCS=/usr/local/bin/helm-docs

      - name: Generate Helm values reference
        run: make helm-docs HELM_DOCS=/usr/local/bin/helm-docs

      # Zensical reports link diagnostics as warnings; --strict turns them into
      # a failing build, while --clean prevents stale output from masking drift.
      - name: Build the site (strict; validates links and anchors)
        run: zensical build --clean --strict

      # Documentation must stand on its own for anyone who clones this
      # repository. References to planning artefacts that live outside it are
      # dead links for every contributor, so they are rejected outright.
      - name: Reject references to artefacts outside this repository
        run: ./hack/verify-docs-selfcontained.sh

      # Readers copy these snippets verbatim. A `<placeholder>` is a shell
      # redirection, so such a line cannot even be parsed, let alone run.
      - name: Check that every shell snippet can be pasted into a shell
        run: ./hack/verify-docs-shell.sh

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/helm-setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: docs/requirements.lock

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install Zensical dependencies
        run: pip install --require-hashes -r docs/requirements.lock

      - name: Generate CRD API reference
        run: make docs-api

      - name: Generate Helm values reference
        run: make helm-docs HELM_DOCS=/usr/local/bin/helm-docs

      - name: Deploy to GitHub Pages
        run: zensical build --clean --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
