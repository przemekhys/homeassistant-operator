name: Helm Chart

on:
  pull_request:
    paths:
      - "charts/**"
      - "config/**"
      - "hack/*.sh"
      - "hack/rbac-allowlist.txt"
      - "Makefile"
      - "docs/user-guide/upgrade.md"
      - ".github/workflows/test-helm.yml"
      - ".github/actions/helm-setup/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=cert-manager/cert-manager
  CERT_MANAGER_VERSION: v1.21.1

jobs:
  lint:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/helm-setup
      - name: helm lint
        run: helm lint charts/homeassistant-operator

  values-schema:
    name: values schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/helm-setup
      - name: Validate values.yaml against values.schema.json
        run: make helm-schema-lint

  unit:
    name: helm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/helm-setup
      - name: helm unittest
        run: helm unittest charts/homeassistant-operator

  docs:
    name: helm-docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/helm-setup
      - name: Verify chart README is up to date
        run: make helm-verify-docs HELM_DOCS=/usr/local/bin/helm-docs

  sync:
    name: chart synced with config/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/helm-setup
      - name: Install kustomize
        run: make kustomize
      - name: Verify chart is regenerated from config/
        run: make helm-verify-sync

  equivalence:
    name: kustomize <-> helm equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/helm-setup
      - name: Install kustomize
        run: make kustomize
      - name: Verify Kustomize and Helm renders are equivalent
        run: make helm-verify-equivalence

  rbac-upgrade:
    name: RBAC privilege gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags needed for N-1 discovery
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/helm-setup
      - name: Install kustomize
        run: make kustomize
      - name: Verify RBAC is not silently expanded vs previous release
        run: make helm-verify-rbac-upgrade

  e2e-k3d:
    name: fresh install + upgrade (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # historical runs finish in 3-5 min; catches a hang instead of running to GitHub's 360min default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags needed for N-1 discovery
          persist-credentials: false
      - uses: ./.github/actions/helm-setup
        with:
          install-k3d: "true"
      - name: Fresh install + upgrade N-1 -> HEAD on k3d
        run: make helm-test-e2e
