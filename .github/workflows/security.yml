name: Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Report status
        if: success()
        run: echo "✅ No vulnerabilities found"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Vulnerabilities detected!"
          echo "Please update affected dependencies or review the security report above."
          exit 1
