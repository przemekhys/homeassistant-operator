name: Security Scan

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Report status
        if: success()
        run: echo "✅ No vulnerabilities found"

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Vulnerabilities detected!"
          echo "Please update affected dependencies or review the security report above."
          exit 1

  pod-security:
    name: Restricted Pod Security Standard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify operator manifests satisfy "restricted"
        run: make verify-pss

      - name: Report failure
        if: failure()
        run: |
          echo "❌ Operator manifests do not satisfy the restricted Pod Security Standard!"
          echo "verify-pss checks two render paths — review whichever the log flagged:"
          echo "  - Kustomize: config/manager/manager.yaml (PSA namespace labels + securityContext)"
          echo "  - Helm: charts/homeassistant-operator/templates/namespace.yaml, deployment.yaml, values.yaml"
          exit 1

  kyverno-policy-test:
    name: Sample Kyverno Policy Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # go install fails for this module: its go.mod carries replace directives,
      # which Go's module resolver refuses to honor for a non-main module — so
      # the prebuilt release binary is installed directly instead, verified
      # against the release's published checksums.txt.
      - name: Install Kyverno CLI
        run: |
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_CLI_VERSION="v1.19.0"
          ASSET="kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz"
          BASE_URL="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}"
          curl -sSLO "${BASE_URL}/${ASSET}"
          curl -sSLO "${BASE_URL}/checksums.txt"
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar xzf "${ASSET}" kyverno
          chmod +x kyverno
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Test sample verification policy
        run: kyverno test hack/kyverno/kyverno-test/
