name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Generate coverage report
        run: |
          go tool cover -html=cover.out -o coverage.html

      - name: Go Test Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: cover.out
          local-prefix: github.com/przemekhys/homeassistant-operator
          threshold-file: 80
          threshold-package: 80
          threshold-total: 80
          # Exclude packages that cannot be reasonably unit tested:
          # - api/v1alpha1: auto-generated deepcopy code and type definitions
          # - cmd: main.go with os.Exit() calls, requires integration testing
          # - test/utils: test utilities used only by e2e tests
          # - internal/version: simple version vars set via ldflags
          exclude-files: |
            ^api/v1alpha1/zz_generated\.deepcopy\.go$
            ^cmd/main\.go$
          exclude-packages: |
            ^api/v1alpha1$
            ^cmd$
            ^test/utils$
            ^internal/version$
          # Generate coverage badge
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('cover.out', 'utf8');
            const lines = output.split('\n');
            const totalLine = lines.find(l => l.startsWith('total:'));
            let coverage = 'N/A';
            if (totalLine) {
              const match = totalLine.match(/(\d+\.\d+)%/);
              if (match) coverage = match[1] + '%';
            }

            const body = `## 📊 Test Coverage Report

            **Total Coverage:** ${coverage}

            ---
            *Generated by Go Test Coverage Action*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
