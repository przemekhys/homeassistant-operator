name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Generate coverage report
        run: |
          go tool cover -html=cover.out -o coverage.html

      - name: Go Test Coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const output = execSync('go tool cover -func=cover.out').toString();
            const lines = output.split('\n');
            const totalLine = lines.find(l => l.includes('total:'));
            let coverage = 'N/A';
            if (totalLine) {
              const match = totalLine.match(/(\d+\.\d+)%/);
              if (match) coverage = match[1] + '%';
            }

            const body = `## 📊 Test Coverage Report

            **Total Coverage:** ${coverage}

            ---
            *Generated by Go Test Coverage Action*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
