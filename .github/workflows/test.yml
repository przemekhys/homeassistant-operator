name: Tests

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "charts/**"
      - "test/**"
      - "hack/**"
      - "Dockerfile"
      - "bundle.Dockerfile"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "PROJECT"
      - ".github/actions/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "config/**"
      - "charts/**"
      - "test/**"
      - "hack/**"
      - "Dockerfile"
      - "bundle.Dockerfile"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "PROJECT"
      - ".github/actions/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
