name: E2E Tests

on:
  push:
    branches: [main, v*]
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=k3d-io/k3d
  K3D_VERSION: v5.9.0
  # renovate: datasource=docker depName=rancher/k3s
  K3S_VERSION: v1.36.3-k3s1
  # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
  HA_VERSION: "2026.8.2"
  # renovate: datasource=github-releases depName=cert-manager/cert-manager
  CERT_MANAGER_VERSION: v1.21.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build and cache operator image once, shared by every e2e-* job below
  # so no job redundantly rebuilds it (see docs/development/testing.md).
  build:
    name: Build Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build operator image
        run: make docker-build IMG=operator:e2e

      - name: Save image as tarball
        run: docker save operator:e2e -o operator-e2e.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-image
          path: operator-e2e.tar
          retention-days: 1

      - name: Pull Home Assistant image
        run: docker pull ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }}

      - name: Save Home Assistant image as tarball
        run: docker save ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -o ha-image.tar

      - name: Upload Home Assistant image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ha-image
          path: ha-image.tar
          retention-days: 1

      # Built once here rather than in each of the 9 e2e-* jobs below: those
      # all `needs: build` and start together right after this job finishes,
      # so a per-job cache (keyed on K3D_VERSION) would race — none of the 9
      # can see another's cache write mid-flight, meaning every one of them
      # would independently pay the compile cost on the same cache-miss (a
      # fresh K3D_VERSION bump, or the very first run). Building once here and
      # downloading the artifact below removes that race entirely.
      - name: Install k3d
        run: |
          go install -ldflags "-s -w -X github.com/k3d-io/k3d/v5/version.Version=${{ env.K3D_VERSION }}" \
            github.com/k3d-io/k3d/v5@${{ env.K3D_VERSION }}

      - name: Upload k3d binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: k3d-binary
          path: ~/go/bin/k3d
          retention-days: 1

  # Jobs 2-10: the e2e suite split across nine jobs that run concurrently,
  # each selecting a scoped subset of ./test/e2e/ via Ginkgo's --label-filter.
  # Because all nine `needs: build`, the workflow's real end-to-end time is
  # build's own duration PLUS the slowest of the nine e2e jobs — not just
  # the slowest job in isolation. See docs/development/testing.md (the sole
  # source of truth for e2e suite/job duration) for the current target and
  # the rationale behind this split (previously one long sequential job).
  #
  # timeout-minutes below were tuned from real CI runs of this workflow.
  # e2e-community-repository-a/-b currently run above the per-job target
  # every other job keeps to, because their specs took longer against a
  # genuinely cold cluster/runner than initial estimates (extrapolated from
  # a single long-running, cache-warm job) suggested — see
  # docs/development/testing.md for the current known-gap note. These two
  # are the ones to re-tighten first once more real completion-time data is
  # available; every other job's timeout is close to its measured cost.

  e2e-critical-a:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Download k3d binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: k3d-binary
          path: /tmp/k3d-bin

      - name: Install k3d from artifact
        run: |
          chmod +x /tmp/k3d-bin/k3d
          echo "/tmp/k3d-bin" >> "$GITHUB_PATH"

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Download Home Assistant image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ha-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-critical-a \
            --image rancher/k3s:${{ env.K3S_VERSION }} \
            --agents 0 \
            --servers-memory 4g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-critical-a

      - name: Load Home Assistant image into k3d
        run: |
          docker load -i ha-image.tar
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-critical-a

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E critical-path group-a tests
        env:
          K3D_CLUSTER: e2e-critical-a
          HA_VERSION: ${{ env.HA_VERSION }}
          CERT_MANAGER_VERSION: ${{ env.CERT_MANAGER_VERSION }}
          CERT_MANAGER_INSTALL_SKIP: "true"
          E2E_IMG: "operator:e2e"
          E2E_SKIP_IMAGE_BUILD: "true"
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --label-filter="critical-path && group-a" \
            --timeout=7m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          echo "=== Controller Manager Logs ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix | tee controller-manager.log || true
          echo "=== Controller Manager Previous (crashed) Container Logs, if any ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix --previous 2>/dev/null | tee -a controller-manager.log || true

      - name: Upload controller logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-manager-logs-critical-a
          path: controller-manager.log
          retention-days: 7

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== HomeAssistantConfigurations ==="
          kubectl get homeassistantconfigurations --all-namespaces -o wide || true
          echo "=== HomeAssistantSecrets ==="
          kubectl get homeassistantsecrets --all-namespaces -o wide || true
          echo "=== HomeAssistantAutomations ==="
          kubectl get homeassistantautomations --all-namespaces -o wide || true
          echo "=== HomeAssistantScenes ==="
          kubectl get homeassistantscenes --all-namespaces -o wide || true
          echo "=== HomeAssistantScripts ==="
          kubectl get homeassistantscripts --all-namespaces -o wide || true
          echo "=== HomeAssistantIntegrations ==="
          kubectl get homeassistantintegrations --all-namespaces -o wide || true
          echo "=== HomeAssistantFloors ==="
          kubectl get homeassistantfloors --all-namespaces -o wide || true
          echo "=== HomeAssistantLabels ==="
          kubectl get homeassistantlabels --all-namespaces -o wide || true
          echo "=== HomeAssistantAreas ==="
          kubectl get homeassistantareas --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-critical-a

  e2e-critical-b:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Download k3d binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: k3d-binary
          path: /tmp/k3d-bin

      - name: Install k3d from artifact
        run: |
          chmod +x /tmp/k3d-bin/k3d
          echo "/tmp/k3d-bin" >> "$GITHUB_PATH"

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Download Home Assistant image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ha-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-critical-b \
            --image rancher/k3s:${{ env.K3S_VERSION }} \
            --agents 0 \
            --servers-memory 4g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-critical-b

      - name: Load Home Assistant image into k3d
        run: |
          docker load -i ha-image.tar
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-critical-b

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E critical-path group-b tests
        env:
          K3D_CLUSTER: e2e-critical-b
          HA_VERSION: ${{ env.HA_VERSION }}
          CERT_MANAGER_INSTALL_SKIP: "true"
          E2E_IMG: "operator:e2e"
          E2E_SKIP_IMAGE_BUILD: "true"
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --label-filter="critical-path && group-b" \
            --timeout=7m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix | tee controller-manager.log || true

      - name: Upload controller logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-manager-logs-critical-b
          path: controller-manager.log
          retention-days: 7

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces --sort-by=.lastTimestamp || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-critical-b

  e2e-tls:
    needs: build
    runs-on: ubuntu-latest
    # Widened from 11 to 13 (and the Ginkgo --timeout below from 7m to 9m)
    # after a real CI run hit [TIMEDOUT] mid-bootstrap-wait in the native TLS
    # spec — that spec has since moved to its own e2e-tls-bootstrap job (see
    # its Label("bootstrap") comment in tls_native_test.go for the real root
    # cause), but the budget is kept here rather than tightened back down
    # until real post-split timing data justifies it.
    timeout-minutes: 13

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Download k3d binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: k3d-binary
          path: /tmp/k3d-bin

      - name: Install k3d from artifact
        run: |
          chmod +x /tmp/k3d-bin/k3d
          echo "/tmp/k3d-bin" >> "$GITHUB_PATH"

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Download Home Assistant image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ha-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-tls \
            --image rancher/k3s:${{ env.K3S_VERSION }} \
            --agents 0 \
            --servers-memory 4g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-tls

      - name: Load Home Assistant image into k3d
        run: |
          docker load -i ha-image.tar
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-tls

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E TLS tests
        env:
          K3D_CLUSTER: e2e-tls
          HA_VERSION: ${{ env.HA_VERSION }}
          CERT_MANAGER_VERSION: ${{ env.CERT_MANAGER_VERSION }}
          E2E_IMG: "operator:e2e"
          E2E_SKIP_IMAGE_BUILD: "true"
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --label-filter="tls && !slow && !bootstrap" \
            --timeout=9m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          echo "=== Controller Manager Logs ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix | tee controller-manager.log || true
          echo "=== Controller Manager Previous (crashed) Container Logs, if any ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix --previous 2>/dev/null | tee -a controller-manager.log || true

      - name: Upload controller logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-manager-logs-tls
          path: controller-manager.log
          retention-days: 7

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect webhook diagnostics on failure
        if: failure()
        run: |
          echo "=== ValidatingWebhookConfiguration (live, incl. caBundle length) ==="
          kubectl get validatingwebhookconfiguration -o yaml || true
          echo "=== caBundle byte length per webhook (empty/missing means TLS trust is broken) ==="
          kubectl get validatingwebhookconfiguration -o json | \
            jq -r '.items[] | .metadata.name as $n | .webhooks[] | "\($n) / \(.name): caBundle len=\(.clientConfig.caBundle | length // 0)"' || true
          echo "=== webhook-server-cert Secret (keys + data lengths only) ==="
          kubectl get secret -n homeassistant-operator-system homeassistant-operator-webhook-server-cert -o json | \
            jq -r '.data // {} | to_entries[] | "\(.key): \(.value | length) bytes (base64)"' || true
          echo "=== webhook Service + Endpoints ==="
          kubectl get svc,endpoints -n homeassistant-operator-system -o wide || true
          echo "=== apiserver admission webhook dispatch log (dispatcher.go) — every call/failure, unfiltered by volume ==="
          docker logs k3d-e2e-tls-server-0 2>&1 | grep -E "dispatcher\.go|webhook_duration|failed calling webhook|failing open" || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-tls

  # Split out of e2e-tls: the only e2e spec in the repo that waits out HA's
  # own ~5-6 minute internal auto-revert timer (a rejected native-TLS
  # rotation reverting to the last-known-good certificate). Combined with the
  # other tls specs it repeatedly blew the shared job's time budget; on its
  # own cluster/job it can be given headroom without inflating e2e-tls's.
  e2e-tls-revert:
    needs: build
    runs-on: ubuntu-latest
    # Widened from 12 to 16 after a real CI run showed the spec itself
    # completing (all assertions passed, teardown already starting) at
    # ~12m45s — a real HA bootstrap (needed since native_tls_test.go's specs
    # now provision one so reconcileHTTPConfigViaWS can get an API token) adds
    # meaningful setup time on top of the ~6-7 minute auto-revert wait itself,
    # and 12 minutes left no margin at all: the job was cancelled seconds
    # after the test had already succeeded, purely on the job-level timeout.
    timeout-minutes: 16

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Download k3d binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: k3d-binary
          path: /tmp/k3d-bin

      - name: Install k3d from artifact
        run: |
          chmod +x /tmp/k3d-bin/k3d
          echo "/tmp/k3d-bin" >> "$GITHUB_PATH"

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Download Home Assistant image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ha-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-tls-revert \
            --image rancher/k3s:${{ env.K3S_VERSION }} \
            --agents 0 \
            --servers-memory 4g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-tls-revert

      - name: Load Home Assistant image into k3d
        run: |
          docker load -i ha-image.tar
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-tls-revert

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E TLS auto-revert test
        env:
          K3D_CLUSTER: e2e-tls-revert
          HA_VERSION: ${{ env.HA_VERSION }}
          CERT_MANAGER_VERSION: ${{ env.CERT_MANAGER_VERSION }}
          E2E_IMG: "operator:e2e"
          E2E_SKIP_IMAGE_BUILD: "true"
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --label-filter="tls && slow" \
            --timeout=9m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix | tee controller-manager.log || true

      - name: Upload controller logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-manager-logs-tls-revert
          path: controller-manager.log
          retention-days: 7

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-tls-revert

  # Split out of e2e-tls: the only tls spec that combines spec.bootstrap with
  # spec.alpha.tls.native on the same instance. haScheme(ha) flips to "https"
  # as soon as TLSReady is True — which reconcileHTTPConfigViaWS sets via the
  # WSConfigUnsupported fallback the moment cert-manager issues the
  # certificate, before the pod has necessarily picked up and restarted onto
  # the injected YAML ssl_certificate/ssl_key. Bootstrap's own scheme-aware
  # HTTP client then has to wait out that separate, asynchronous
  # YAML-injection-plus-restart cycle before its first successful health
  # check — real extra latency a plain-HTTP bootstrap never pays. Combined
  # with e2e-tls's other specs this blew a 13-minute job budget with no clean
  # Ginkgo timeout message (bootstrap's own Eventually uses a deliberately
  # generous 45-minute timeout, relying on the job wrapper as the real
  # backstop) — on its own cluster/job it gets headroom without inflating
  # e2e-tls's or risking the same starvation for the other specs there.
  e2e-tls-bootstrap:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Download k3d binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: k3d-binary
          path: /tmp/k3d-bin

      - name: Install k3d from artifact
        run: |
          chmod +x /tmp/k3d-bin/k3d
          echo "/tmp/k3d-bin" >> "$GITHUB_PATH"

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Download Home Assistant image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ha-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-tls-bootstrap \
            --image rancher/k3s:${{ env.K3S_VERSION }} \
            --agents 0 \
            --servers-memory 4g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-tls-bootstrap

      - name: Load Home Assistant image into k3d
        run: |
          docker load -i ha-image.tar
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-tls-bootstrap

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E native TLS + bootstrap test
        env:
          K3D_CLUSTER: e2e-tls-bootstrap
          HA_VERSION: ${{ env.HA_VERSION }}
          CERT_MANAGER_VERSION: ${{ env.CERT_MANAGER_VERSION }}
          E2E_IMG: "operator:e2e"
          E2E_SKIP_IMAGE_BUILD: "true"
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --label-filter="tls && bootstrap" \
            --timeout=10m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=-1 --prefix | tee controller-manager.log || true

      - name: Upload controller logs artifact on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controller-manager-logs-tls-bootstrap
          path: controller-manager.log
          retention-days: 7

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-tls-bootstrap

