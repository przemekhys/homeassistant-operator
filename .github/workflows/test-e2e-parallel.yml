name: E2E Tests

on:
  push:
    branches: [main, v*]
  pull_request:

permissions:
  contents: read

env:
  K3D_VERSION: v5.7.4
  HA_VERSION: stable

jobs:
  # Job 1: Build and cache operator image
  build:
    name: Build Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Build operator image
        run: make docker-build IMG=operator:e2e

      - name: Save image as tarball
        run: docker save operator:e2e -o operator-e2e.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-image
          path: operator-e2e.tar
          retention-days: 1

  # Job 2: Critical path E2E — 1 bootstrap, 11 tests sequential
  # Estimated time: ~40-50 min (bootstrap ~30 min + tests ~10 min)
  e2e-critical-path:
    name: E2E Critical Path
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/${{ env.K3D_VERSION }}/install.sh | bash

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-critical \
            --agents 0 \
            --servers-memory 12g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-critical

      - name: Preload Home Assistant image into k3d
        run: |
          docker pull ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }}
          k3d image import ghcr.io/home-assistant/home-assistant:${{ env.HA_VERSION }} -c e2e-critical

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E critical path tests
        env:
          K3D_CLUSTER: e2e-critical
          HA_VERSION: ${{ env.HA_VERSION }}
        run: |
          make ginkgo
          ./bin/ginkgo run \
            -v \
            --timeout=59m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          echo "=== Controller Manager Logs ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=500 || true

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== HomeAssistantConfigurations ==="
          kubectl get homeassistantconfigurations --all-namespaces -o wide || true
          echo "=== HomeAssistantSecrets ==="
          kubectl get homeassistantsecrets --all-namespaces -o wide || true
          echo "=== HomeAssistantAutomations ==="
          kubectl get homeassistantautomations --all-namespaces -o wide || true
          echo "=== HomeAssistantScenes ==="
          kubectl get homeassistantscenes --all-namespaces -o wide || true
          echo "=== HomeAssistantScripts ==="
          kubectl get homeassistantscripts --all-namespaces -o wide || true
          echo "=== HomeAssistantIntegrations ==="
          kubectl get homeassistantintegrations --all-namespaces -o wide || true
          echo "=== HomeAssistantFloors ==="
          kubectl get homeassistantfloors --all-namespaces -o wide || true
          echo "=== HomeAssistantLabels ==="
          kubectl get homeassistantlabels --all-namespaces -o wide || true
          echo "=== HomeAssistantAreas ==="
          kubectl get homeassistantareas --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-critical
