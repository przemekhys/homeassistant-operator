name: E2E Tests (Parallel)

on:
  push:
    branches: [main, v*]
  pull_request:

env:
  K3D_VERSION: v5.7.4

jobs:
  # Job 1: Build and cache operator image
  build:
    name: Build Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build operator image
        run: make docker-build IMG=operator:e2e

      - name: Save image as tarball
        run: docker save operator:e2e -o operator-e2e.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: operator-image
          path: operator-e2e.tar
          retention-days: 1

  # Job 2-N: Run tests in parallel with matrix strategy
  # All tests use 4× parallelization for optimal speed (~12-15× faster than sequential)
  e2e:
    name: E2E (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            label: "core"
            procs: 4
            timeout: 5

          - name: homeassistant
            label: "homeassistant"
            procs: 4
            timeout: 30

          - name: secrets
            label: "secrets"
            procs: 4
            timeout: 30

          - name: configuration
            label: "configuration"
            procs: 4
            timeout: 30

          - name: negative
            label: "negative"
            procs: 4
            timeout: 8

          # Automation tests - fast path (no bootstrap)
          - name: automation-fast
            label: "automation && fast"
            procs: 4
            timeout: 20

          # Automation tests - slow path (with bootstrap/hot-reload)
          - name: automation-slow
            label: "automation && slow"
            procs: 4
            timeout: 45

          # Scene tests - fast path (no bootstrap)
          - name: scene-fast
            label: "scene && fast"
            procs: 4
            timeout: 20

          # Scene tests - slow path (with bootstrap/hot-reload)
          - name: scene-slow
            label: "scene && slow"
            procs: 4
            timeout: 45

          # Addon tests - fast path (resource creation, no pod startup)
          - name: addon-fast
            label: "addon && fast"
            procs: 4
            timeout: 20

          # Addon tests - slow path (pod startup + bootstrap for B1)
          - name: addon-slow
            label: "addon && slow"
            procs: 2
            timeout: 60

    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Ginkgo CLI
        uses: actions/cache@v5
        with:
          path: bin/ginkgo*
          key: ginkgo-${{ hashFiles('go.mod', 'Makefile') }}
          restore-keys: |
            ginkgo-

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Verify k3d installation
        run: k3d version

      - name: Download operator image artifact
        uses: actions/download-artifact@v8
        with:
          name: operator-image

      - name: Create k3d cluster
        run: |
          k3d cluster create e2e-${{ matrix.name }} \
            --agents 0 \
            --servers-memory 12g \
            --wait \
            --timeout 5m

      - name: Load operator image into k3d
        run: |
          docker load -i operator-e2e.tar
          k3d image import operator:e2e -c e2e-${{ matrix.name }}

      - name: Pre-load addon images into k3d (for addon-slow tests)
        if: contains(matrix.name, 'addon-slow')
        run: |
          for image in eclipse-mosquitto:2 mariadb:11 nodered/node-red:latest; do
            docker pull $image
            k3d image import $image -c e2e-${{ matrix.name }}
          done

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Run E2E tests for ${{ matrix.name }}
        env:
          K3D_CLUSTER: e2e-${{ matrix.name }}
        run: |
          # All tests use Ginkgo CLI with parallelization
          make ginkgo
          echo "Running ${{ matrix.name }} tests with Ginkgo procs=${{ matrix.procs }}"
          # Set Ginkgo timeout 1 min less than job timeout to allow graceful cleanup
          GINKGO_TIMEOUT=$(( ${{ matrix.timeout }} - 1 ))
          ./bin/ginkgo run \
            --label-filter="${{ matrix.label }}" \
            --procs=${{ matrix.procs }} \
            -v \
            --timeout=${GINKGO_TIMEOUT}m \
            ./test/e2e/

      - name: Collect controller logs on failure
        if: failure()
        run: |
          echo "=== Controller Manager Logs ==="
          kubectl logs -n homeassistant-operator-system \
            -l control-plane=controller-manager \
            --tail=500 || true

      - name: Collect Kubernetes events on failure
        if: failure()
        run: |
          echo "=== Kubernetes Events ==="
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp || true

      - name: Collect resource status on failure
        if: failure()
        run: |
          echo "=== HomeAssistant Resources ==="
          kubectl get homeassistants --all-namespaces -o wide || true
          echo "=== HomeAssistantConfigurations ==="
          kubectl get homeassistantconfigurations --all-namespaces -o wide || true
          echo "=== HomeAssistantSecrets ==="
          kubectl get homeassistantsecrets --all-namespaces -o wide || true
          echo "=== HomeAssistantAutomations ==="
          kubectl get homeassistantautomations --all-namespaces -o wide || true
          echo "=== HomeAssistantScenes ==="
          kubectl get homeassistantscenes --all-namespaces -o wide || true
          echo "=== Pods ==="
          kubectl get pods --all-namespaces -o wide || true
          echo "=== StatefulSets ==="
          kubectl get statefulsets --all-namespaces -o wide || true

      - name: Cleanup k3d cluster
        if: always()
        run: k3d cluster delete e2e-${{ matrix.name }}
