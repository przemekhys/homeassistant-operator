site_name: Home Assistant Operator
site_description: Kubernetes operator for deploying and managing Home Assistant instances
site_url: https://przemekhys.github.io/homeassistant-operator/
repo_name: przemekhys/homeassistant-operator
repo_url: https://github.com/przemekhys/homeassistant-operator
edit_uri: edit/main/docs/

# Link integrity gate. MkDocs only offers warn/info/ignore for these checks
# (there is no "error" level), so they become hard failures via
# `mkdocs build --strict`, which the Makefile and the docs workflow both use.
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn
  nav:
    not_found: warn
    omitted_files: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - include-markdown:
  # Every path that was ever published stays reachable. Some of these URLs are
  # quoted in released changelog entries, which are a historical record and are
  # not rewritten — a redirect is the only way to keep those entries true.
  - redirects:
      redirect_maps:
        getting-started/installation.md: how-to/install-operator.md
        getting-started/quick-start.md: tutorials/first-instance.md
        getting-started/configuration.md: how-to/manage-configuration.md
        user-guide/homeassistant.md: how-to/deploy-instance.md
        user-guide/bootstrap.md: how-to/bootstrap-instance.md
        user-guide/secrets.md: how-to/manage-secrets.md
        user-guide/configuration.md: how-to/manage-configuration.md
        user-guide/automations.md: how-to/manage-automations.md
        user-guide/scenes.md: how-to/manage-scenes.md
        user-guide/scripts.md: how-to/manage-scripts.md
        user-guide/integrations.md: how-to/register-integrations.md
        user-guide/infrastructure.md: how-to/model-house-structure.md
        user-guide/backup.md: how-to/configure-backups.md
        user-guide/security.md: how-to/enforce-pod-security.md
        user-guide/tls.md: how-to/expose-with-tls.md
        user-guide/signed-releases.md: how-to/verify-signed-releases.md
        user-guide/upgrade.md: how-to/upgrade-operator.md
        reference/troubleshooting.md: how-to/troubleshoot.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Your first instance: tutorials/first-instance.md
    - Your first automation: tutorials/first-automation.md
  - How-to Guides:
    - Overview: how-to/index.md
    - Install the operator: how-to/install-operator.md
    - Upgrade the operator: how-to/upgrade-operator.md
    - Deploy an instance: how-to/deploy-instance.md
    - Bootstrap an instance: how-to/bootstrap-instance.md
    - Manage configuration: how-to/manage-configuration.md
    - Manage secrets: how-to/manage-secrets.md
    - Manage automations: how-to/manage-automations.md
    - Manage scenes: how-to/manage-scenes.md
    - Manage scripts: how-to/manage-scripts.md
    - Register integrations: how-to/register-integrations.md
    - Model your house structure: how-to/model-house-structure.md
    - Install HACS-compatible extensions: how-to/install-community-repositories.md
    - Configure backups: how-to/configure-backups.md
    - Expose with TLS: how-to/expose-with-tls.md
    - Enforce Pod Security Standards: how-to/enforce-pod-security.md
    - Verify signed releases: how-to/verify-signed-releases.md
    - Troubleshoot a problem: how-to/troubleshoot.md
  - Reference:
    - Overview: reference/index.md
    - CRD API reference: reference/api.md
    - Status conditions: reference/conditions.md
    - Events: reference/events.md
    - Helm chart values: reference/helm-values.md
    - Compatibility: reference/compatibility.md
    - FAQ: reference/faq.md
    - Changelog: reference/changelog.md
  - Explanation:
    - Overview: explanation/index.md
    - The reconciliation model: explanation/reconciliation-model.md
    - Hot reload versus restart: explanation/reload-vs-restart.md
    - Who owns the generated resources: explanation/resource-ownership.md
    - What spec.alpha means: explanation/alpha-lifecycle.md
    - The security model: explanation/security-model.md
  - Ecosystem Guides:
    - Overview: ecosystem/index.md
    - Flux CD: ecosystem/flux.md
    - External secret management: ecosystem/secrets-management.md
  - For Contributors:
    - Contributing: development/contributing.md
    - Branching & releases: development/branching.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
    - Writing documentation: development/documentation-style.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/przemekhys/homeassistant-operator
