# Example: Home Assistant exposed via operator-managed Gateway API (spec.gateway)
# with a cert-manager-issued TLS certificate.
#
# Unlike ha_v1_gateway_api.yaml (which shows manually-authored Gateway/HTTPRoute),
# here the operator manages the routing resources: it creates the HTTPRoute (and,
# when manageGateway=true, a Gateway with an HTTPS listener) plus a cert-manager
# Certificate whose Secret backs the listener. GatewayClass and the gateway
# controller remain the platform's responsibility.
#
# Prerequisites:
# - Gateway API CRDs + a controller (e.g. Traefik v3)
# - cert-manager + a ready Issuer/ClusterIssuer (referenced below)
#
# Set manageGateway: true to let the operator create the Gateway and select an
# existing GatewayClass with gatewayClassName. Alternatively, use parentRef to
# attach the HTTPRoute to an existing Gateway.
#
# This example also shows spec.gateway.filters: route-level behaviors (header
# modification, redirect, URL rewrite) applied to the route, without needing a
# hand-authored HTTPRoute.
apiVersion: ha.homeassistant.io/v1
kind: HomeAssistant
metadata:
  name: homeassistant-gateway-tls
spec:
  version: "stable"
  timezone: "Europe/Warsaw"
  storage:
    size: "5Gi"
  service:
    type: ClusterIP
    port: 8123
  gateway:
    enabled: true
    host: ha.example.com
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    manageGateway: true
    # gatewayClassName defaults to traefik when omitted.
    gatewayClassName: traefik
    # Alternatively, attach the HTTPRoute to an existing Gateway listener:
    # parentRef:
    #   name: traefik-gateway
    #   namespace: gateway
    #   sectionName: https
    # secretName: my-existing-tls   # bring-your-own; overrides issuerRef
    # Route-level filters (optional): applied, in order, to the single route
    # the operator manages for this instance. Supported types:
    # RequestHeaderModifier, ResponseHeaderModifier, RequestRedirect, URLRewrite.
    filters:
      - type: RequestRedirect
        requestRedirect:
          scheme: https
          statusCode: 301
      - type: ResponseHeaderModifier
        responseHeaderModifier:
          set:
            - name: X-Frame-Options
              value: SAMEORIGIN
---
apiVersion: ha.homeassistant.io/v1
kind: HomeAssistantConfiguration
metadata:
  name: homeassistant-gateway-tls-config
spec:
  homeAssistantRef:
    name: homeassistant-gateway-tls
  configuration: |
    homeassistant:
      name: Home
      unit_system: metric
    default_config:
    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.0.0/16
        - 10.43.0.0/16
