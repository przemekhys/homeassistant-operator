---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: homeassistantscenes.ha.homeassistant.io
spec:
  group: ha.homeassistant.io
  names:
    categories:
    - homeassistant
    kind: HomeAssistantScene
    listKind: HomeAssistantSceneList
    plural: homeassistantscenes
    shortNames:
    - hascene
    - hasc
    singular: homeassistantscene
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.homeAssistantRef.name
      name: HomeAssistant
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - description: Number of entities
      jsonPath: .status.entityCount
      name: Entities
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: HomeAssistantScene is the Schema for the homeassistantscenes
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HomeAssistantSceneSpec defines the desired state of HomeAssistantScene
            properties:
              autoReload:
                default: true
                description: |-
                  AutoReload enables automatic hot-reload when scene configuration changes
                  If false, requires manual reload or pod restart
                type: boolean
              entities:
                description: |-
                  Entities define the list of devices and their states to set when scene is activated
                  At least one entity is required
                items:
                  description: SceneEntity represents a single entity (device) in
                    a scene with its desired state
                  properties:
                    attributes:
                      description: |-
                        Attributes contains additional entity-specific attributes
                        Examples: brightness, color_temp, rgb_color for lights
                        This is a flexible structure that accepts any valid Home Assistant entity attributes
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    entity_id:
                      description: |-
                        EntityID is the Home Assistant entity identifier in format domain.object_id
                        Examples: light.living_room, switch.fan, climate.bedroom
                      pattern: ^[a-z_]+\.[a-z0-9_]+$
                      type: string
                    state:
                      description: |-
                        State is the desired state for this entity
                        Examples: "on", "off", numeric values
                      type: string
                  required:
                  - entity_id
                  - state
                  type: object
                minItems: 1
                type: array
              homeAssistantRef:
                description: HomeAssistantRef references the HomeAssistant CR that
                  will use this scene
                properties:
                  name:
                    description: Name of the HomeAssistant resource
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              icon:
                description: |-
                  Icon is a Material Design icon for the scene (e.g., "mdi:movie", "mdi:candle")
                  See https://mdi.bessarabov.com/ for available icons
                type: string
              id:
                description: |-
                  ID is a unique identifier for the scene (used by Home Assistant)
                  If not specified, will be auto-generated from the CR name
                  Must contain only lowercase letters, digits, and underscores. Existing
                  resources with an id predating this constraint (uppercase letters or
                  hyphens) keep working until their next update, which will then be
                  rejected until id is renamed to a conforming value.
                pattern: ^[a-z][a-z0-9_]*$
                type: string
              name:
                description: |-
                  Name is a user-friendly name for the scene (displayed in Home Assistant UI)
                  If not specified, the CR name will be used
                minLength: 1
                type: string
            required:
            - entities
            - homeAssistantRef
            type: object
          status:
            description: HomeAssistantSceneStatus defines the observed state of HomeAssistantScene
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the HomeAssistantScene state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              entityCount:
                description: |-
                  EntityCount is the number of entities defined in the scene
                  Updated by the controller for display in kubectl output
                format: int32
                type: integer
              lastActivated:
                description: LastActivated is the timestamp when the scene was last
                  activated (if available from HA)
                format: date-time
                type: string
              lastError:
                description: |-
                  LastError contains the error message from the last failed operation
                  Cleared when operation succeeds
                type: string
              lastReloadTime:
                description: LastReloadTime is the timestamp of the last successful
                  reload
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed HomeAssistantScene
                format: int64
                type: integer
              sceneHash:
                description: |-
                  SceneHash is the SHA256 hash of the current scene configuration
                  Used to detect changes and determine if reload is needed
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.homeAssistantRef is immutable after creation
          rule: '!has(oldSelf.spec) || self.spec.homeAssistantRef == oldSelf.spec.homeAssistantRef'
    served: true
    storage: true
    subresources:
      status: {}
