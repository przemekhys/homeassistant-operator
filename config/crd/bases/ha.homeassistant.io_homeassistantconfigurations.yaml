---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: homeassistantconfigurations.ha.homeassistant.io
spec:
  group: ha.homeassistant.io
  names:
    kind: HomeAssistantConfiguration
    listKind: HomeAssistantConfigurationList
    plural: homeassistantconfigurations
    shortNames:
    - haconfig
    - hacfg
    singular: homeassistantconfiguration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.homeAssistantRef.name
      name: HomeAssistant
      type: string
    - jsonPath: .spec.reloadStrategy
      name: Strategy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HomeAssistantConfiguration is the Schema for the homeassistantconfigurations
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HomeAssistantConfigurationSpec defines the desired state
              of HomeAssistantConfiguration
            properties:
              autoReload:
                default: true
                description: AutoReload enables automatic reloading/restart when configuration
                  changes
                type: boolean
              configuration:
                description: |-
                  Configuration contains the full configuration.yaml content as a string
                  This is the raw YAML configuration for Home Assistant
                type: string
              homeAssistantRef:
                description: HomeAssistantRef references the HomeAssistant CR that
                  will use this configuration
                properties:
                  name:
                    description: Name of the HomeAssistant resource
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              http:
                description: HTTP component configuration (optional typed section)
                properties:
                  corsDomains:
                    description: CorsDomains is a list of allowed CORS origins
                    items:
                      type: string
                    type: array
                  trustProxy:
                    description: TrustProxy enables trust in X-Forwarded-For header
                    type: boolean
                  useXForwardedFor:
                    description: UseXForwardedFor enables usage of X-Forwarded-For
                      header
                    type: boolean
                type: object
              logger:
                description: Logger component configuration (optional typed section)
                properties:
                  defaultLevel:
                    default: INFO
                    description: DefaultLevel is the default logging level (DEBUG,
                      INFO, WARNING, ERROR, CRITICAL)
                    type: string
                  logs:
                    additionalProperties:
                      type: string
                    description: |-
                      Logs is a map of component names to their logging levels
                      Example: {"homeassistant.core": "DEBUG", "homeassistant.components.mqtt": "DEBUG"}
                    type: object
                type: object
              mqtt:
                description: MQTT component configuration (optional typed section)
                properties:
                  broker:
                    description: Broker is the MQTT broker address (e.g., "mqtt://localhost:1883")
                    type: string
                  clientID:
                    description: ClientID for MQTT connection
                    type: string
                  keepAlive:
                    default: 60
                    description: KeepAlive defines MQTT keep-alive interval in seconds
                    format: int32
                    type: integer
                  passwordRef:
                    description: |-
                      PasswordRef references a Secret containing the MQTT password
                      The Secret should have a "password" key
                    properties:
                      key:
                        description: Key in the Secret (if not specified, defaults
                          to "password" or "value")
                        type: string
                      name:
                        description: Name of the Secret
                        type: string
                    required:
                    - name
                    type: object
                  username:
                    description: Username for MQTT authentication
                    type: string
                required:
                - broker
                type: object
              recorder:
                description: Recorder component configuration (optional typed section)
                properties:
                  database:
                    description: |-
                      Database URL for the recorder (e.g., "postgresql://user:pass@host/db")
                      If not specified, uses SQLite with default path.
                      Mutually exclusive with DatabaseSecretRef; DatabaseSecretRef takes precedence.
                    type: string
                  databaseSecretRef:
                    description: |-
                      DatabaseSecretRef references a Secret containing the database URL.
                      The resolved value is written as plain text into configuration.yaml,
                      avoiding the !secret tag which is stripped by the YAML round-trip.
                      Takes precedence over Database if both are set.
                      The Secret must be in the same namespace as the HomeAssistant CR.
                    properties:
                      key:
                        description: Key in the Secret (if not specified, defaults
                          to "password" or "value")
                        type: string
                      name:
                        description: Name of the Secret
                        type: string
                    required:
                    - name
                    type: object
                  enabled:
                    default: true
                    description: Enabled controls if the recorder is enabled
                    type: boolean
                  purgeKeepDays:
                    default: 30
                    description: PurgeKeepDays specifies how many days of history
                      to keep
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              reloadStrategy:
                default: auto
                description: ReloadStrategy defines how configuration changes should
                  be applied
                enum:
                - auto
                - hot-reload
                - restart
                type: string
            required:
            - configuration
            - homeAssistantRef
            type: object
          status:
            description: HomeAssistantConfigurationStatus defines the observed state
              of HomeAssistantConfiguration
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the HomeAssistantConfiguration state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              configHash:
                description: |-
                  ConfigHash is the SHA256 hash of the current configuration
                  Used to detect changes and determine if reload is needed
                type: string
              lastError:
                description: |-
                  LastError contains the error message from the last failed reload attempt
                  Cleared when reload succeeds
                type: string
              lastReloadMethod:
                description: LastReloadMethod indicates how the last reload was performed
                  (hot-reload or restart)
                type: string
              lastReloadTime:
                description: LastReloadTime is the timestamp of the last successful
                  reload/restart
                format: date-time
                type: string
              observedGeneration:
                description: Generation tracks the generation of the spec that the
                  status reflects
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: spec.homeAssistantRef is immutable after creation
          rule: '!has(oldSelf.spec) || self.spec.homeAssistantRef == oldSelf.spec.homeAssistantRef'
    served: true
    storage: true
    subresources:
      status: {}
