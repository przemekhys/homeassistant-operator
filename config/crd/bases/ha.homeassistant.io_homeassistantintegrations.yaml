                x-kubernetes-list-type: map
              configHash:
                description: |-
                  ConfigHash is the SHA256 hash of the resolved configuration values.
                  Used to detect spec changes and trigger reconfiguration (delete + re-create).
                type: string
              entryID:
                description: EntryID is the Home Assistant config entry ID created
                  or adopted by the Config Flow
                type: string
              lastError:
                description: |-
                  LastError contains the error message from the last failed operation
                  Cleared when operation succeeds
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed CR
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
