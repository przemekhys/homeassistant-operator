---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: homeassistants.ha.homeassistant.io
spec:
  group: ha.homeassistant.io
  names:
    kind: HomeAssistant
    listKind: HomeAssistantList
    plural: homeassistants
    shortNames:
    - ha
    - has
    singular: homeassistant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HomeAssistant is the Schema for the homeassistants API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HomeAssistantSpec defines the desired state of HomeAssistant.
            properties:
              backup:
                description: |-
                  Backup configures automatic backups using Home Assistant's built-in backup system.
                  Requires bootstrap with API token enabled.
                properties:
                  agentIDs:
                    description: |-
                      AgentIDs is the list of backup agent IDs to use
                      (e.g. "backup.local", "google_drive.my_drive").
                      Defaults to ["backup.local"] if not specified.
                    items:
                      type: string
                    type: array
                  enabled:
                    default: false
                    description: Enabled controls whether automatic backups are configured
                      in HA
                    type: boolean
                  includeDatabase:
                    default: true
                    description: IncludeDatabase controls whether the database is
                      included in the backup.
                    type: boolean
                  recurrence:
                    default: daily
                    description: Recurrence defines how often to create a backup
                    enum:
                    - daily
                    - mon
                    - tue
                    - wed
                    - thu
                    - fri
                    - sat
                    - sun
                    - never
                    type: string
                  retentionCopies:
                    description: RetentionCopies is the number of backup copies to
                      keep. Nil means unlimited.
                    format: int32
                    minimum: 1
                    type: integer
                  retentionDays:
                    description: RetentionDays is the number of days to keep backups.
                      Nil means unlimited.
                    format: int32
                    minimum: 1
                    type: integer
                  time:
                    description: |-
                      Time is the time of day to create the backup in HH:MM:SS 24-hour format (e.g. "03:00:00").
                      If empty, Home Assistant picks automatically.
                    pattern: ^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$
                    type: string
                type: object
              bootstrap:
                description: |-
                  Bootstrap configures automatic onboarding and API token creation
                  When enabled, the operator will automatically complete the Home Assistant
                  onboarding process and create a long-lived access token for API access
                properties:
                  analytics:
                    default: false
                    description: |-
                      Analytics controls whether to enable analytics during onboarding
                      If not specified, analytics is disabled by default
                    type: boolean
                  apiTokenSecretName:
                    description: |-
                      APITokenSecretName is the name of the Secret where the API token will be stored
                      The Secret will have a "token" key containing the long-lived access token
                      If not specified, defaults to "{homeassistant-name}-homeassistant-api-token"
                    type: string
                  createApiToken:
                    default: true
                    description: |-
                      CreateAPIToken controls whether a long-lived access token is created after onboarding
                      The token is valid for 10 years and stored in a Secret
                    type: boolean
                  credentials:
                    description: |-
                      Credentials references a Secret containing username and password for the admin user
                      The Secret must have "username" and "password" keys
                    properties:
                      secretRef:
                        description: SecretRef references a Secret containing username
                          and password
                        properties:
                          name:
                            description: Name of the Secret
                            type: string
                          passwordKey:
                            default: password
                            description: PasswordKey is the key in the Secret containing
                              the password
                            type: string
                          usernameKey:
                            default: username
                            description: UsernameKey is the key in the Secret containing
                              the username
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether automatic bootstrap is performed
                    type: boolean
                  language:
                    default: en
                    description: Language is the language code for Home Assistant
                      (e.g., "en", "pl")
                    type: string
                  location:
                    description: |-
                      Location configures the location settings during onboarding
                      If not specified, location configuration step is skipped
                    properties:
                      currency:
                        description: Currency is the ISO 4217 currency code (e.g.,
                          "USD", "EUR", "PLN")
                        type: string
                      elevation:
                        description: Elevation in meters
                        type: integer
                      latitude:
                        description: Latitude in decimal degrees (e.g., "52.2297")
                        pattern: ^-?([0-8]?[0-9](\.[0-9]+)?|90(\.0+)?)$
                        type: string
                      longitude:
                        description: Longitude in decimal degrees (e.g., "21.0122")
                        pattern: ^-?(1[0-7][0-9](\.[0-9]+)?|[0-9]{1,2}(\.[0-9]+)?|180(\.0+)?)$
                        type: string
                      name:
                        description: Name is the location name (e.g., "Home", "Warsaw")
                        type: string
                      timeZone:
                        description: |-
                          TimeZone is the IANA timezone (e.g., "Europe/Warsaw", "America/New_York")
                          If not specified, uses spec.timezone
                        type: string
                      unitSystem:
                        default: metric
                        description: UnitSystem defines the unit system ("metric"
                          or "us_customary")
                        enum:
                        - metric
                        - us_customary
                        type: string
                    type: object
                  ownerName:
                    default: Admin
                    description: OwnerName is the display name for the owner user
                      created during onboarding
                    type: string
                type: object
              hostNetwork:
                description: |-
                  HostNetwork enables host networking for the Home Assistant pod.
                  When true, the pod uses the host's network namespace, enabling discovery
                  of IoT devices via mDNS, SSDP, and DHCP on the local network.
                type: boolean
              image:
                default: ghcr.io/home-assistant/home-assistant
                description: Image allows overriding the default Home Assistant image
                type: string
              ingress:
                description: Ingress configuration for external access
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Annotations to add to the Ingress resource
                    type: object
                  enabled:
                    default: false
                    description: Enabled controls whether an Ingress resource is created
                    type: boolean
                  host:
                    description: Host is the hostname for the Ingress (e.g., "ha.example.com")
                    type: string
                  ingressClassName:
                    description: IngressClassName specifies the Ingress controller
                      to use
                    type: string
                  tls:
                    description: TLS configuration
                    properties:
                      enabled:
                        default: false
                        description: Enabled controls whether TLS is enabled
                        type: boolean
                      secretName:
                        description: SecretName containing the TLS certificate. If
                          empty, cert-manager annotation should be used.
                        type: string
                    type: object
                type: object
              resources:
                description: Resources defines CPU and memory requests/limits
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              secretsFrom:
                description: |-
                  SecretsFrom references a Secret containing secrets.yaml
                  The Secret should have a key "secrets.yaml" with the HA secrets
                properties:
                  name:
                    description: Name of the Secret
                    type: string
                required:
                - name
                type: object
              service:
                description: Service configuration for exposing Home Assistant
                properties:
                  nodePort:
                    description: NodePort for NodePort service type (optional, auto-assigned
                      if not set)
                    format: int32
                    type: integer
                  port:
                    default: 8123
                    description: Port for the Home Assistant web UI
                    format: int32
                    type: integer
                  type:
                    default: ClusterIP
                    description: Type of Kubernetes Service (ClusterIP, NodePort,
                      LoadBalancer)
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              storage:
                description: Storage configuration for Home Assistant data
                properties:
                  accessMode:
                    default: ReadWriteOnce
                    description: AccessMode for the PVC
                    type: string
                  initContainer:
                    description: |-
                      InitContainer configures the init container that pre-creates required YAML files
                      (automations.yaml, scenes.yaml, scripts.yaml) on the PVC before Home Assistant starts.
                      This prevents HA from entering recovery mode when the !include directives are present
                      but the files do not yet exist.
                    properties:
                      image:
                        default: busybox
                        description: Image is the container image name (e.g. "busybox")
                        type: string
                      repository:
                        default: docker.io/library
                        description: Repository is the container image repository
                          (e.g. "docker.io/library")
                        type: string
                      tag:
                        default: "1.36"
                        description: Tag is the container image tag (e.g. "1.36",
                          "latest")
                        type: string
                    type: object
                  retainPVC:
                    default: false
                    description: |-
                      RetainPVC controls whether the PVC survives deletion of the HomeAssistant CR.
                      When true, no ownerReference is set on the PVC — it will not be garbage-collected
                      when the CR is deleted (e.g. by FluxCD reconciliation), preventing accidental data loss.
                      When false (default), the PVC is owned by the CR and deleted together with it.
                    type: boolean
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 5Gi
                    description: Size of the persistent volume (e.g., "5Gi", "10Gi")
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: StorageClassName for the PVC. If empty, uses cluster
                      default.
                    type: string
                type: object
              timezone:
                default: UTC
                description: Timezone for the Home Assistant instance (e.g., "Europe/Warsaw")
                type: string
              version:
                default: stable
                description: Version is the Home Assistant version/tag to deploy (e.g.,
                  "2024.1.0", "stable", "latest")
                type: string
            type: object
          status:
            description: HomeAssistantStatus defines the observed state of HomeAssistant.
            properties:
              bootstrap:
                description: BootstrapStatus contains the status of the automatic
                  bootstrap process
                properties:
                  apiTokenReady:
                    description: APITokenReady indicates whether the API token has
                      been created and stored
                    type: boolean
                  apiTokenSecretName:
                    description: APITokenSecretName is the name of the Secret containing
                      the API token
                    type: string
                  completed:
                    description: Completed indicates whether the bootstrap process
                      has finished successfully
                    type: boolean
                  lastAttempt:
                    description: LastAttempt is the timestamp of the last bootstrap
                      attempt
                    format: date-time
                    type: string
                  loginRecoveryAttempts:
                    description: |-
                      LoginRecoveryAttempts tracks how many times login recovery was attempted.
                      Reset to zero when onboarding is confirmed fresh or bootstrap succeeds.
                    type: integer
                  message:
                    description: Message provides additional information about the
                      bootstrap status
                    type: string
                  onboardingDoneFirstSeen:
                    description: |-
                      OnboardingDoneFirstSeen is the timestamp when /api/onboarding first returned 404.
                      Used to implement confirmation delay without relying on condition LastTransitionTime
                      (which does not update when only the Reason changes).
                    format: date-time
                    type: string
                type: object
              conditions:
                description: Conditions represent the latest available observations
                  of the HomeAssistant state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSelfUnban:
                description: LastSelfUnban is the timestamp of the most recent self-unban
                  operation.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed HomeAssistant
                format: int64
                type: integer
              phase:
                description: Phase represents the current lifecycle phase of the HomeAssistant
                  instance
                enum:
                - Pending
                - Running
                - Failed
                - Unknown
                type: string
              ready:
                description: Ready indicates if the Home Assistant instance is ready
                  to serve traffic
                type: boolean
              selfUnbanCount:
                description: |-
                  SelfUnbanCount is the number of times the operator has removed its own IP
                  from HA's ip_bans.yaml and restarted the pod to clear in-memory bans.
                format: int32
                type: integer
              url:
                description: URL is the access URL for Home Assistant (if Ingress
                  is enabled)
                type: string
              version:
                description: Version is the currently deployed Home Assistant version
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
