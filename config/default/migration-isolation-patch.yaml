# This patch is separate from controller-gen's manifests.yaml so regeneration
# preserves the isolation webhook and the shared serving-certificate CA bundle.
- op: add
  path: /webhooks/-
  value:
    name: vmigrationisolationpods.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: references-migration-credentials
        expression: >-
          (has(object.spec.imagePullSecrets) && object.spec.imagePullSecrets.exists(s, s.name.startsWith('migration-proxy-'))) ||
          (has(object.spec.volumes) && object.spec.volumes.exists(v,
            (has(v.secret) && v.secret.secretName.startsWith('migration-proxy-')) ||
            (has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.secret) && s.secret.name.startsWith('migration-proxy-'))))) ||
          object.spec.containers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))) ||
          (has(object.spec.initContainers) && object.spec.initContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-'))))) ||
          (has(object.spec.ephemeralContainers) && object.spec.ephemeralContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))))
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-migration-isolation
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
- op: add
  path: /webhooks/-
  value:
    name: vmigrationisolationcredentials.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: reserved-credential-name
        expression: "(request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name).startsWith('migration-proxy-')"
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-migration-isolation
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps"]
- op: add
  path: /webhooks/-
  value:
    name: vmigrationisolationworkloads.ha.homeassistant.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchConditions:
      - name: references-migration-credentials
        expression: >-
          (has(object.spec.template.spec.imagePullSecrets) && object.spec.template.spec.imagePullSecrets.exists(s, s.name.startsWith('migration-proxy-'))) ||
          (has(object.spec.template.spec.volumes) && object.spec.template.spec.volumes.exists(v,
            (has(v.secret) && v.secret.secretName.startsWith('migration-proxy-')) ||
            (has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s, has(s.secret) && s.secret.name.startsWith('migration-proxy-'))))) ||
          object.spec.template.spec.containers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))) ||
          (has(object.spec.template.spec.initContainers) && object.spec.template.spec.initContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-'))))) ||
          (has(object.spec.template.spec.ephemeralContainers) && object.spec.template.spec.ephemeralContainers.exists(c,
            (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef) && e.secretRef.name.startsWith('migration-proxy-'))) ||
            (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name.startsWith('migration-proxy-')))))
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-migration-isolation
    rules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["statefulsets"]
